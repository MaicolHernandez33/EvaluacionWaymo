[browser]
gatherUsageStats = false

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 500

[theme]
base = "light"
primaryColor = "#2457D6"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EAEFF6"
textColor = "#14202F"
font = "sans serif"
baseRadius = "0.6rem"
borderColor = "#D8E0EB"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#1B2D4A"
textColor = "#E8EEF7"
primaryColor = "#8DB0FF"
borderColor = "#2A3E5E"
