# Configuracion de seguridad de la pagina de EP3 (se lee al lanzar `streamlit run` desde la raiz del repositorio).
# La pagina escucha solo en el propio equipo, sin telemetria y sin el boton Deploy. Una prueba (tests/ep3/test_seguridad_pagina.py) la vigila.
[server]
address = "localhost"
headless = false
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Tema (F24): oscuro, generado desde TOKENS de app/estilos.py con scripts/ep3/generar_config_tema.py (no editar a mano); tipografia del sistema, sin fuentes externas.
[theme]
base = "dark"
primaryColor = "#6FA0FF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#18253D"
textColor = "#E8EEF8"
font = "sans serif"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
borderColor = "#2A3A57"
linkColor = "#6FA0FF"
linkUnderline = true
dataframeBorderColor = "#22314D"
dataframeHeaderBackgroundColor = "#18253D"
dataframeHeaderTextColor = "#A9B8CF"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0E1729"
secondaryBackgroundColor = "#18253D"
textColor = "#E8EEF8"
primaryColor = "#6FA0FF"
borderColor = "#1E2B45"
