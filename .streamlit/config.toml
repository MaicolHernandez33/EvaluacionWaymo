# Configuracion de seguridad de la pagina de EP3 (se lee al lanzar `streamlit run` desde la raiz del repositorio).
# La pagina escucha solo en el propio equipo, sin telemetria y sin el boton Deploy. Una prueba (tests/ep3/test_seguridad_pagina.py) la vigila.
[server]
address = "localhost"
headless = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Tema (F18-C1): paleta sobria definida en app/estilos.py (TOKENS); tipografia del sistema, sin fuentes externas.
[theme]
base = "light"
primaryColor = "#1D4E89"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F9"
textColor = "#1B2430"
font = "sans serif"
