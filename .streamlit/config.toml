# Configuracion de seguridad de la pagina de EP3 (se lee al lanzar `streamlit run` desde la raiz del repositorio).
# La pagina escucha solo en el propio equipo, sin telemetria y sin el boton Deploy. Una prueba (tests/ep3/test_seguridad_pagina.py) la vigila.
[server]
address = "localhost"
headless = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Tema (F22): barra lateral de tinta, lienzo claro y cobalto; definido en app/estilos.py (TOKENS); tipografia del sistema, sin fuentes externas.
[theme]
base = "light"
primaryColor = "#2457D6"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EAEFF6"
textColor = "#14202F"
font = "sans serif"
baseRadius = "0.6rem"
borderColor = "#D8E0EB"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0F1B2D"
secondaryBackgroundColor = "#1B2D4A"
textColor = "#E8EEF7"
primaryColor = "#8DB0FF"
borderColor = "#2A3E5E"
