preprocesamiento:
  # altura_maxima_m viene de la celda de la seccion 5 del notebook
  # 01_exploracion_csv que revisa box_height con
  # describe(percentiles=[.5,.9,.99,.999]) y el conteo "box_height > 6": el
  # maximo real observado es 3,598 m, 6 m queda como techo preventivo sin
  # efecto sobre los datos actuales.
  altura_maxima_m: 6.0

  # velocidad_maxima_mps viene de la celda de la seccion 5 del notebook
  # 01_exploracion_csv que ordena la cola de speed_mps por encima de 25 m/s:
  # el salto vacio entre 32,425 y 182,764 m/s justifica el corte en 50.
  velocidad_maxima_mps: 50.0

  # columnas_protegidas evita que eliminar_columnas_sin_varianza borre
  # weather o time_of_day en silencio si, sobre otro corte de datos (por
  # ejemplo un segmento real 100% sunny), su varianza cae a 0 sin que eso
  # sea un defecto.
  columnas_protegidas:
    - weather
    - time_of_day

ingesta_waymo:
  # metadata_segmentos documenta weather, time_of_day y location de cada
  # segmento real de Waymo. No viene en los parquet de lidar_box ni de
  # camera_to_lidar_box_association (esos archivos no traen esas 3
  # columnas): se documento a partir de la exploracion en Colab. Los 4
  # segmentos se eligieron a proposito para maximizar contraste de clima,
  # momento del dia y ubicacion (ver notebooks/02_exploracion_waymo.ipynb,
  # seccion 1).
  metadata_segmentos:
    "10023947602400723454_1120_000_1140_000":
      weather: sunny
      time_of_day: Day
      location: location_sf
    "10206293520369375008_2796_800_2816_800":
      weather: sunny
      time_of_day: Night
      location: location_phx
    "11017034898130016754_697_830_717_830":
      weather: sunny
      time_of_day: Dawn/Dusk
      location: location_other
    "6791933003490312185_2607_000_2627_000":
      weather: rain
      time_of_day: Dawn/Dusk
      location: location_phx
